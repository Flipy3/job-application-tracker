<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>求职进度追踪器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <h1>保存岗位</h1>
      </header>

      <form id="job-form" class="job-form">
        <label class="field">
          <span>邮箱</span>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </label>

        <label class="field">
          <span>密码</span>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>

        <label class="field">
          <span>岗位名称</span>
          <input
            id="job-title"
            name="title"
            type="text"
            autocomplete="off"
            required
          />
        </label>

        <label class="field">
          <span>公司名称</span>
          <input
            id="company"
            name="company"
            type="text"
            autocomplete="off"
            required
          />
        </label>

        <label class="field">
          <span>薪资</span>
          <input id="salary" name="salary" type="text" autocomplete="off" />
        </label>

        <label class="field">
          <span>工作地点</span>
          <input id="location" name="location" type="text" autocomplete="off" />
        </label>

        <label class="field">
          <span>来源</span>
          <input
            id="source"
            name="source"
            type="text"
            autocomplete="off"
            placeholder="Boss直聘、LinkedIn、Seek"
          />
        </label>

        <label class="field">
          <span>岗位链接</span>
          <input id="job-url" name="url" type="url" autocomplete="off" />
        </label>

        <label class="field">
          <span>备注</span>
          <textarea id="notes" name="notes" rows="4"></textarea>
        </label>

        <button id="save-button" type="submit" class="save-button">
          保存岗位
        </button>

        <button id="clear-credentials-button" type="button" class="secondary-button">
          清除登录信息
        </button>

        <p id="save-status" class="save-status" role="status"></p>
      </form>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
